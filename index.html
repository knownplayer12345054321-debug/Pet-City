var imgMap=new Map(),imgBack={},imgKeep=new Map(),blobBad=false;
var preQ=[],preT=0,preSeen=new WeakSet();
function preloadImgs(){
  (data.items||[]).forEach(function(it){if(it.img&&!preSeen.has(it)){preSeen.add(it);preQ.push(it)}});
  if(!preT&&preQ.length)preT=setTimeout(preStep,30);
}
function preStep(){
  preT=0;
  var n=0;
  while(preQ.length&&n<6){
    var it=preQ.shift(),src=imgSrc(it.img);n++;
    if(imgKeep.has(src))continue;
    var im=new Image();
    im.onerror=function(){if(!blobBad){blobBad=true;imgMap.clear();imgKeep.clear()}};
    im.src=src;
    imgKeep.set(src,im);
    if(im.decode)im.decode().catch(function(){});
  }
  if(preQ.length)preT=setTimeout(preStep,40);
}
function imgSrc(u){
  if(u.slice(0,5)!=='data:'||blobBad)return u;
  var c=imgMap.get(u);if(c)return c;
  try{
    var i=u.indexOf(','),semi=u.indexOf(';'),mime=u.slice(5,semi>0&&semi<i?semi:i)||'image/png',bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);
    for(var k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);
    c=URL.createObjectURL(new Blob([a],{type:mime}));imgBack[c]=u;
  }catch(e){c=u}
  imgMap.set(u,c);return c;
}

/* cards are added in small batches so the page stays responsive with big lists */
function fillList(){
  var tok=listQ.t,boxes=document.querySelectorAll('#list .cards[data-lt="'+tok+'"]'),els=[],left=16;
  if(!boxes.length)return;
  for(var b=0;b<boxes.length;b++)els[+boxes[b].dataset.lc]=boxes[b];
  function step(){
    listRaf=0;
    if(tok!==listQ.t)return;
    var n=left,more=false;left=10;
    for(var j=0;j<listQ.jobs.length;j++){
      var job=listQ.jobs[j],el=els[j];
      if(job.i>=job.items.length)continue;
      if(!el||!el.isConnected)return;
      if(n<=0){more=true;continue}
      var end=Math.min(job.items.length,job.i+n),h='';
      n-=end-job.i;
      for(;job.i<end;job.i++)h+=cardHtml(job.items[job.i]);
      el.insertAdjacentHTML('beforeend',h);
      if(job.i<job.items.length)more=true;
    }
    if(more)listRaf=requestAnimationFrame(step);
  }
  step();
}

function buildDoc(){
  var css=document.getElementById('app-style').textContent;
  var js=document.getElementById('app-script').textContent;
  var json=JSON.stringify(data).replace(/</g,'\\u003c');
  var S='scr'+'ipt';
  var reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>Pet City</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="app-style">'+css+'</style>\n'
   +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">\n<div id="root"></div>\n'
   +'<'+S+' type="application/json" id="app-data">'+json+'</'+S+'>\n<'+S+' id="app-script">'+js+'</'+S+'></body></html>';
}
function standaloneDoc(){
  var css=document.getElementById('app-style').textContent;
  var js=document.getElementById('app-script').textContent;
  var json=JSON.stringify(data).replace(/</g,'\\u003c');
  var S='scr'+'ipt';
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">\n<title>Pet City</title>\n<style id="app-style">'+css+'</style>\n'
   +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">\n</head>\n<body>\n<div id="root"></div>\n'
   +'<'+S+' type="application/json" id="app-data">'+json+'</'+S+'>\n<'+S+' id="app-script">'+js+'</'+S+'>\n</body>\n</html>\n';
}
function downloadHtml(){
  var blob=new Blob([standaloneDoc()],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  toast('Downloaded index.html. Upload it to GitHub to publish your changes.');
}
async function doPublish(){
  if(!window.claude){downloadHtml();return}
  try{
    var a=window.claude&&await claude.use('artifact');
    if(!a){toast('Publishing is not available in this view.');return}
    toast('Publishing…');
    await a.publish(buildDoc());
    ls('pc-draft',null);
  }catch(err){toast(err&&err.code==='conflict'?'Someone published first. Reloading.':'Could not publish: '+((err&&err.message)||'unknown error'))}
}
